name: Update Instagram Stats

on:
  schedule:
    # Runs every 4 hours. Change the cron expression below if you want a different frequency.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch account stats and latest post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          curl -s "https://graph.instagram.com/v21.0/${IG_USER_ID}?fields=followers_count,follows_count,media_count&access_token=${IG_ACCESS_TOKEN}" -o account.json

          curl -s "https://graph.instagram.com/v21.0/${IG_USER_ID}/media?fields=id,caption,media_type,media_url,thumbnail_url,permalink,timestamp&limit=4&access_token=${IG_ACCESS_TOKEN}" -o media.json

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          IG_ACCESS_TOKEN = os.environ['IG_ACCESS_TOKEN']

          with open('account.json') as f:
              account = json.load(f)
          with open('media.json') as f:
              media = json.load(f)

          recent_posts = media.get('data', [])[:4]

          # Instagram's media-list endpoint sometimes omits media_url for
          # video/Reels posts, even though the post itself has one. Asking
          # about that one post directly (by its own id) almost always
          # returns it, so patch in the missing links one at a time.
          for post in recent_posts:
              needs_url = post.get('media_type') == 'VIDEO' and not post.get('media_url')
              if not needs_url:
                  continue
              url = (
                  f"https://graph.instagram.com/v21.0/{post['id']}"
                  f"?fields=media_url,thumbnail_url&access_token={IG_ACCESS_TOKEN}"
              )
              try:
                  with urllib.request.urlopen(url, timeout=15) as resp:
                      single = json.load(resp)
                  if single.get('media_url'):
                      post['media_url'] = single['media_url']
                  if single.get('thumbnail_url') and not post.get('thumbnail_url'):
                      post['thumbnail_url'] = single['thumbnail_url']
              except Exception as e:
                  # Don't fail the whole run over one post's video link -
                  # it'll just fall back to a photo preview this cycle and
                  # try again on the next run.
                  print(f"Could not refetch media_url for {post['id']}: {e}")
              time.sleep(0.5)

          output = {**account, 'recent_posts': recent_posts, 'updated_at': datetime.now(timezone.utc).isoformat()}

          with open('stats.json', 'w') as f:
              json.dump(output, f, indent=2)
          PY

          cat stats.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Instagram stats"
          # If main moved since we checked out (e.g. someone pushed a manual
          # change while this was running), rebase our commit on top instead
          # of failing outright.
          git pull --rebase origin main
          git push
