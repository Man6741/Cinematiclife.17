name: Update Instagram Stats

on:
  schedule:
    # Runs every 4 hours. Change the cron expression below if you want a different frequency.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch account stats and latest post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          curl -s "https://graph.instagram.com/v21.0/${IG_USER_ID}?fields=followers_count,follows_count,media_count&access_token=${IG_ACCESS_TOKEN}" -o account.json

          curl -s "https://graph.instagram.com/v21.0/${IG_USER_ID}/media?fields=id,caption,media_type,media_url,thumbnail_url,permalink,timestamp&limit=4&access_token=${IG_ACCESS_TOKEN}" -o media.json

          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          with open('account.json') as f:
              account = json.load(f)
          with open('media.json') as f:
              media = json.load(f)

          recent_posts = media.get('data', [])[:4]

          # Instagram only gives a like count per individual post, so to get a
          # true "total likes across everything he's posted" figure we have to
          # page through every post and add up like_count ourselves.
          def fetch_json(url):
              with urllib.request.urlopen(url, timeout=30) as resp:
                  return json.loads(resp.read().decode())

          ig_user_id = os.environ['IG_USER_ID']
          ig_token = os.environ['IG_ACCESS_TOKEN']

          total_likes = 0
          posts_counted = 0
          try:
              url = (
                  f"https://graph.instagram.com/v21.0/{ig_user_id}/media"
                  f"?fields=like_count&limit=100&access_token={ig_token}"
              )
              while url:
                  page = fetch_json(url)
                  for item in page.get('data', []):
                      total_likes += item.get('like_count') or 0
                      posts_counted += 1
                  url = page.get('paging', {}).get('next')
          except Exception as e:
              # If Instagram rate-limits or errors out partway through, don't
              # let that take down the whole stats update. Fall back to
              # whatever total we'd already built up this run, or the
              # previous value already on disk if we got nothing at all.
              print(f"Warning: stopped paging through posts early ({e})")
              if posts_counted == 0:
                  try:
                      with open('stats.json') as f:
                          total_likes = json.load(f).get('total_likes', 0)
                  except Exception:
                      total_likes = 0

          output = {
              **account,
              'recent_posts': recent_posts,
              'total_likes': total_likes,
              'updated_at': datetime.now(timezone.utc).isoformat(),
          }

          with open('stats.json', 'w') as f:
              json.dump(output, f, indent=2)
          PY

          cat stats.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Instagram stats"
          # If main moved since we checked out (e.g. someone pushed a manual
          # change while this was running), rebase our commit on top instead
          # of failing outright.
          git pull --rebase origin main
          git push
